<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>simile</title>
    <!-- Shell styles from the sienna submodule, then this app's overrides. -->
    <link rel="stylesheet" href="sienna/src/styles.css" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Vendored libraries from the shell (classic scripts; set global jQuery). -->
    <script src="sienna/vendor/jquery.min.js"></script>
    <script src="sienna/vendor/jquery-ui.js"></script>

    <!-- Shell core, in dependency order. Content widgets are NOT listed here;
         they are injected on demand by the widget registry. -->
    <script src="sienna/src/core/namespace.js"></script>
    <script src="sienna/src/core/persistence.js"></script>
    <script src="sienna/src/core/widget-registry.js"></script>
    <script src="sienna/src/core/user-data.js"></script>
    <script src="sienna/src/core/actions.js"></script>
    <script src="sienna/src/core/history.js"></script>
    <script src="sienna/src/core/files.js"></script>
    <script src="sienna/src/core/panel.js"></script>
    <script src="sienna/src/core/workspace.js"></script>
    <script src="sienna/src/core/menu.js"></script>
    <script src="sienna/src/core/app.js"></script>
    <script src="sienna/src/core/widget-base.js"></script>

    <!-- This app's own scripts (schema + model layer + widget manifest + bootstrap). -->
    <script src="src/schema/simile-v1.js"></script>
    <script src="src/diagram.js"></script>
    <script src="src/dialog.js"></script>
    <script src="src/grammar.js"></script>
    <script src="src/demo-growth.js"></script>
    <script src="src/demo-submodel.js"></script>
    <script src="src/widgets/index.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
